<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FAF9F6">
    <title>Cianci's Menù</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Colori del sito: i valori veri stanno in style.css (variabili --teal-*, --amber-*, --slate-*, --rose-*)
        const ramp = n => Object.fromEntries([50, 100, 200, 300, 400, 500, 600, 700, 800, 900]
            .map(k => [k, `rgb(var(--${n}-${k}) / <alpha-value>)`]));
        tailwind.config = {
            theme: { extend: { colors: {
                teal: ramp('teal'),
                emerald: ramp('teal'),
                amber: ramp('amber'),
                slate: ramp('slate'),
                rose: ramp('rose'),
                white: 'rgb(var(--white) / <alpha-value>)'
            } } }
        };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col">

    <!-- LOGIN -->
    <div id="loginScreen" class="fixed inset-0 z-50 overflow-y-auto flex items-center justify-center bg-slate-50 p-6">
        <div class="w-full max-w-sm space-y-8">
            <div class="text-center space-y-3">
                <div class="mx-auto w-20 h-20 rounded-full bg-teal-500 text-white flex items-center justify-center shadow-md">
                    <i class="fa-solid fa-bowl-food text-3xl" aria-hidden="true"></i>
                </div>
                <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Cianci's Menù</h1>
                <p class="text-sm font-semibold text-slate-500">La cucina di casa, semplice e serena.</p>
            </div>

            <form id="loginForm" class="space-y-5">
                <div class="space-y-1.5">
                    <label for="usernameInput" class="block text-xs font-bold text-slate-600">Utente</label>
                    <div class="relative">
                        <i class="fa-regular fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm pointer-events-none" aria-hidden="true"></i>
                        <input type="text" id="usernameInput" required autocomplete="username" placeholder="Es. Nicola"
                            class="w-full py-3 pl-11 pr-4 rounded-xl bg-white border-[1.5px] border-slate-300 text-sm font-semibold text-slate-800 placeholder:text-slate-400 outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-500/20 transition">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label for="passwordInput" class="block text-xs font-bold text-slate-600">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm pointer-events-none" aria-hidden="true"></i>
                        <input type="password" id="passwordInput" required autocomplete="current-password" placeholder="La tua password"
                            class="w-full py-3 pl-11 pr-12 rounded-xl bg-white border-[1.5px] border-slate-300 text-sm font-semibold text-slate-800 placeholder:text-slate-400 outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-500/20 transition">
                        <button type="button" data-action="toggle-password" aria-label="Mostra password" aria-pressed="false"
                            class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-lg flex items-center justify-center text-slate-500 hover:text-teal-700 hover:bg-slate-100 transition">
                            <i class="fa-regular fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <div id="loginError" role="alert" class="hidden text-rose-600 text-xs font-bold bg-rose-50 p-2.5 rounded-xl border border-rose-200 text-center">
                    Credenziali non valide. Riprova.
                </div>

                <button type="submit" class="w-full py-3.5 bg-teal-500 hover:bg-teal-600 text-white font-bold rounded-xl shadow-sm transition text-sm flex items-center justify-center gap-2">
                    Entra in cucina
                </button>
            </form>
        </div>
    </div>

    <!-- APP -->
    <div id="appWrapper" class="flex-1 flex flex-col hidden">
        <header class="bg-white/95 backdrop-blur-sm border-b border-slate-200 sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="w-10 h-10 shrink-0 rounded-2xl bg-amber-100 border border-amber-200 flex items-center justify-center text-amber-700 font-bold text-lg">
                        <i class="fa-solid fa-bowl-food"></i>
                    </div>
                    <div class="min-w-0">
                        <h2 class="font-bold text-slate-800 leading-tight text-base">Cianci's Menù</h2>
                        <p class="text-xs font-semibold text-teal-600 truncate" id="welcomeUserText">Bentornato</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <div class="hidden md:flex items-center gap-2">
                        <button data-action="cookbook" class="px-3.5 py-2 bg-teal-50 hover:bg-teal-100 text-teal-800 rounded-xl text-xs font-bold border border-teal-200 transition flex items-center gap-1.5">
                            <i class="fa-solid fa-book-open text-teal-600"></i> Ricettario
                        </button>
                        <button data-action="pantry" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200/70 text-slate-700 rounded-xl text-xs font-bold border border-slate-200 transition flex items-center gap-1.5">
                            <i class="fa-solid fa-box-archive text-slate-500"></i> Dispensa
                        </button>
                        <button data-action="shopping" class="px-3.5 py-2 bg-amber-100 hover:bg-amber-200/80 text-amber-900 rounded-xl text-xs font-bold border border-amber-200 transition flex items-center gap-1.5">
                            <i class="fa-solid fa-cart-shopping text-amber-700"></i> Spesa (<span id="shoppingBadgeWeek">Sett. 1</span>)
                        </button>
                    </div>
                    <button id="logoutBtn" class="p-2 bg-slate-100 hover:bg-rose-50 text-slate-500 hover:text-rose-600 rounded-xl border border-slate-200 transition" title="Esci" aria-label="Esci">
                        <i class="fa-solid fa-right-from-bracket text-sm"></i>
                    </button>
                </div>
            </div>
        </header>

        <nav class="bg-white/90 backdrop-blur-sm border-b border-slate-200 px-4 py-2.5 sticky top-[60px] md:top-[68px] z-20 overflow-x-auto" aria-label="Settimane">
            <div class="max-w-7xl mx-auto flex gap-2.5 no-scrollbar" id="weekTabs"></div>
        </nav>

        <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 pb-24">
            <div id="weekContent" class="space-y-6"></div>
        </main>
    </div>

    <!-- BARRA MOBILE IN BASSO -->
    <nav id="bottomNav" class="hidden fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur-sm border-t border-slate-200 pb-[env(safe-area-inset-bottom)]" aria-label="Navigazione principale">
        <div class="grid grid-cols-4">
            <button data-action="home" class="bottom-btn text-teal-700"><i class="fa-solid fa-calendar-week"></i><span>Menù</span></button>
            <button data-action="cookbook" class="bottom-btn"><i class="fa-solid fa-book-open"></i><span>Ricettario</span></button>
            <button data-action="shopping" class="bottom-btn"><i class="fa-solid fa-cart-shopping"></i><span>Spesa</span></button>
            <button data-action="pantry" class="bottom-btn"><i class="fa-solid fa-box-archive"></i><span>Dispensa</span></button>
        </div>
    </nav>

    <!-- MODALI -->
    <div id="recipeModal" class="modal hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="recipeTitle">
        <div class="bg-white rounded-3xl card-soft max-w-2xl w-full max-h-[90vh] overflow-y-auto p-5 sm:p-6 space-y-6">
            <div id="recipeModalContent" class="space-y-6"></div>
        </div>
    </div>

    <div id="cookbookModal" class="modal hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="cookbookTitle">
        <div class="bg-white rounded-3xl card-soft max-w-4xl w-full max-h-[90vh] overflow-y-auto p-5 sm:p-6 space-y-4">
            <div class="flex items-start justify-between gap-3 border-b border-slate-100 pb-4">
                <div>
                    <h3 id="cookbookTitle" class="font-bold text-xl text-slate-800"><i class="fa-solid fa-book-open text-teal-600 mr-2"></i>Ricettario (<span id="cookbookCount">0</span>)</h3>
                    <p class="text-xs font-semibold text-slate-500">100% senza latticini · Valori nutrizionali stimati</p>
                </div>
                <button data-action="close" data-modal="cookbookModal" class="modal-close shrink-0" aria-label="Chiudi"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <input type="search" id="cookbookSearch" placeholder="Cerca per piatto o ingrediente (es. salmone, ceci)..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-teal-500 outline-none text-sm font-semibold">
            <div class="space-y-2">
                <div id="cookbookCats" class="flex flex-wrap gap-2"></div>
                <div id="cookbookTags" class="flex flex-wrap gap-2"></div>
            </div>
            <div id="cookbookList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>
    </div>

    <div id="pantryModal" class="modal hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="pantryTitle">
        <div class="bg-white rounded-3xl card-soft max-w-lg w-full max-h-[85vh] overflow-y-auto p-6 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 id="pantryTitle" class="font-bold text-lg text-slate-800"><i class="fa-solid fa-box-archive text-teal-600 mr-2"></i>Dispensa</h3>
                <button data-action="close" data-modal="pantryModal" class="modal-close" aria-label="Chiudi"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-xs text-slate-500 font-semibold">Gli articoli già in dispensa vengono segnalati nella lista della spesa.</p>
            <div id="pantryItemsList" class="space-y-2"></div>
            <div class="flex gap-2 pt-2">
                <input type="text" id="newPantryItem" placeholder="Nuovo articolo..." class="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 focus:border-teal-500 outline-none text-sm font-semibold">
                <button data-action="add-pantry" class="px-4 py-2.5 bg-teal-500 hover:bg-teal-600 text-white font-bold rounded-xl text-sm transition">Aggiungi</button>
            </div>
        </div>
    </div>

    <div id="shoppingModal" class="modal hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="shoppingModalTitle">
        <div class="bg-white rounded-3xl card-soft max-w-lg w-full max-h-[85vh] overflow-y-auto p-6 space-y-4">
            <div class="flex items-start justify-between gap-3 border-b border-slate-100 pb-3">
                <div>
                    <h3 class="font-bold text-lg text-slate-800" id="shoppingModalTitle"></h3>
                    <p class="text-xs font-semibold text-teal-600" id="shoppingModalSubtitle"></p>
                </div>
                <button data-action="close" data-modal="shoppingModal" class="modal-close shrink-0" aria-label="Chiudi"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="flex items-center justify-between gap-2">
                <span id="shoppingCounter" class="text-xs font-bold text-slate-500"></span>
                <button data-action="copy-shopping" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold border border-slate-200 transition flex items-center gap-1.5">
                    <i class="fa-regular fa-copy"></i> Copia
                </button>
            </div>
            <div id="shoppingItemsList" class="divide-y divide-slate-100"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
